name: project-auto-add

# O plano da org permite só um Auto-add nativo (usado pelo repo code);
# este workflow cobre issues e PRs novos deste repo.
on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN || github.token }}
          script: |
            if (!process.env.PROJECT_TOKEN) throw new Error('Configure PROJECT_TOKEN nos secrets do GitHub; o item não foi adicionado ao Project.');
            const node = context.payload.issue ?? context.payload.pull_request;
            const data = await github.graphql(`query{organization(login:"City-Eyes"){projectV2(number:1){id}}}`);
            await github.graphql(`mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}`,
              {p: data.organization.projectV2.id, c: node.node_id});
